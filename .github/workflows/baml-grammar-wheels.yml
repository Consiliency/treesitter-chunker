name: BAML grammar wheels

on:
  pull_request:
    paths:
      - 'packages/baml-grammar/**'
      - '.github/workflows/baml-grammar-wheels.yml'
  workflow_dispatch:
  push:
    tags:
      - 'baml-grammar-v*'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/baml-grammar-v')
        run: |
          version=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('packages/baml-grammar/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          if [ "$GITHUB_REF" != "refs/tags/baml-grammar-v$version" ]; then
            echo "Release tag $GITHUB_REF does not match package version $version" >&2
            exit 1
          fi
      - name: Check vendored grammar hashes
        run: python packages/baml-grammar/scripts/check_baml_grammar.py
      - name: Install locked Tree-sitter generator
        run: npm ci --prefix packages/baml-grammar
      - name: Check generated parser and node inventory
        run: >-
          python packages/baml-grammar/scripts/check_baml_grammar.py
          --regenerate --cli packages/baml-grammar/node_modules/tree-sitter-cli/tree-sitter
      - name: Build and validate source distribution
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 'tree-sitter>=0.26,<0.27' pytest==8.4.2
          python -m build --sdist packages/baml-grammar --outdir dist
          python -m twine check dist/*.tar.gz
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python -m pip install --no-deps rebuilt/*.whl
          python packages/baml-grammar/scripts/check_baml_grammar.py
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/packages/baml-grammar/tests/test_grammar.py" -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baml-sdist
          path: dist/*.tar.gz

  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - target: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - target: macos-arm64
            runner: macos-14
            arch: arm64
          - target: windows-amd64
            runner: windows-2022
            arch: AMD64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Build and smoke-test cp311-abi3 wheel
        env:
          CIBW_BUILD: 'cp311-*'
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_REQUIRES: pytest==8.4.2
          CIBW_TEST_COMMAND: python -m pytest {project}/packages/baml-grammar/tests/test_grammar.py -q
        run: |
          python -m pip install cibuildwheel==4.2.1
          python -m cibuildwheel packages/baml-grammar --output-dir wheelhouse
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baml-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl

  test-wheel:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        target: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows-amd64]
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
          - target: windows-amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: baml-wheel-${{ matrix.target }}
          path: wheelhouse
      - name: Install wheel and parse outside checkout
        shell: bash
        run: |
          python -m pip install 'tree-sitter>=0.26,<0.27' pytest==8.4.2
          version=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('packages/baml-grammar/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links wheelhouse "treesitter-chunker-baml-grammar==$version"
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/packages/baml-grammar/tests/test_grammar.py" -q

  publish:
    if: startsWith(github.ref, 'refs/tags/baml-grammar-v')
    needs: [source, wheel, test-wheel]
    runs-on: ubuntu-24.04
    environment: baml-grammar-pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: baml-wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: baml-sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
