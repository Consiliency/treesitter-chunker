name: Build Documentation

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: docs-publication-main
  cancel-in-progress: false

jobs:
  docs:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Builds repository content in the locked environment: read only.
    permissions:
      contents: read

    env:
      UV_PYTHON: '3.14'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install uv==0.12.11
        uv sync --locked --all-extras

    - name: Build documentation
      run: |
        cd docs/sphinx
        uv run --locked --all-extras sphinx-build -b html . _build/html

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: documentation
        path: docs/sphinx/_build/html/

  deploy:
    timeout-minutes: 10
    # Only publication to the gh-pages branch needs a write token, and only
    # for pushes to main. It publishes the artifact the build job uploaded.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false

    - name: Download documentation artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: documentation
        path: ${{ runner.temp }}/documentation

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ${{ runner.temp }}/documentation
        force_orphan: true
