name: Native Packages Suspended

permissions:
  contents: read

# Owner-approved v5 scope (2026-09-11): PyPI only. Never run on release tags.
'on':
  workflow_dispatch:

jobs:
  native-packages-suspended:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject native package release
        run: |
          echo "::error::Debian, RPM and Homebrew distribution is suspended for v5. See docs/packaging.md for re-enablement requirements."
          exit 1
