name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            platform: ubuntu-latest
            platform-family: linux
          - python-version: '3.12'
            platform: ubuntu-latest
            platform-family: linux
          - python-version: '3.11'
            platform: windows-latest
            platform-family: windows
          - python-version: '3.11'
            platform: macos-latest
            platform-family: macos

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system -e ".[dev,api,viz,templates,advanced]"
        uv pip install --system git+https://github.com/tree-sitter/py-tree-sitter.git@v0.25.2
        uv pip install --system toml httpx  # Required by tests

    - name: Fetch grammars
      run: python scripts/fetch_grammars.py

    - name: Build grammars
      run: python scripts/build_lib.py

    - name: Run linting
      run: |
        ruff check chunker/ tests/
        black --check chunker/ tests/

    - name: Run type checking
      run: |
        if ! mypy chunker/ cli/ --ignore-missing-imports; then
          echo "::warning::mypy reported known non-blocking type issues"
        fi

    - name: Run platform core tests
      run: |
        python scripts/run_platform_core.py --platform ${{ matrix.platform-family }}


    - name: Upload coverage
      if: matrix.platform-family == 'linux' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
