name: Test Suite

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            platform: ubuntu-latest
            platform-family: linux
          - python-version: '3.12'
            platform: ubuntu-latest
            platform-family: linux
          - python-version: '3.11'
            platform: windows-latest
            platform-family: windows
          - python-version: '3.11'
            platform: macos-latest
            platform-family: macos

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system -e ".[dev,api,viz,templates,advanced]"
        uv pip install --system toml httpx  # Required by tests

    - name: Fetch grammars
      run: python scripts/fetch_grammars.py

    - name: Build grammars
      run: python scripts/build_lib.py

    - name: Run linting
      run: |
        # Use the uv-locked ruff/black so CI matches the lockfile + local
        # and avoids unpinned-tool version drift flagging pre-existing issues.
        uv run --all-extras ruff check chunker/ tests/
        uv run --all-extras black --check chunker/ tests/

    - name: Run type checking
      # The baseline-relative mypy gate runs on Linux only: the baseline
      # (docs/development/mypy-baseline.txt) is generated on Linux, and mypy
      # re-derives PLATFORM-SPECIFIC errors on Windows/macOS (e.g. the Unix-only
      # `resource` module in performance_framework.py) that a Linux baseline can
      # never contain — so a per-OS run would flag those as spurious "new"
      # errors. Type-checking the code once on Linux is sufficient and correct.
      if: matrix.platform-family == 'linux'
      shell: bash
      run: |
        uv run --all-extras python scripts/mypy_gate.py

    - name: Run platform core tests
      run: |
        python scripts/run_platform_core.py --platform ${{ matrix.platform-family }}


    - name: Upload coverage
      if: matrix.platform-family == 'linux' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
