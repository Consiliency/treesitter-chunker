name: Test Suite

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    env:
      UV_PYTHON: '3.12'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            platform: ubuntu-latest
            platform-family: linux
          - python-version: '3.12'
            platform: blacksmith-4vcpu-windows-2025
            platform-family: windows
          - python-version: '3.12'
            platform: macos-latest
            platform-family: macos

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-py312-

    - name: Install dependencies
      run: |
        python -m pip install uv==0.12.11
        uv sync --locked --all-extras

    - name: Fetch grammars
      run: uv run --locked --all-extras python scripts/fetch_grammars.py

    - name: Build grammars
      run: uv run --locked --all-extras python scripts/build_lib.py

    - name: Run platform core tests
      run: |
        uv run --locked --all-extras python scripts/run_platform_core.py --platform ${{ matrix.platform-family }}


    - name: Upload coverage
      if: matrix.platform-family == 'linux'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
