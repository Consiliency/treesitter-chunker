name: Test Suite

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    env:
      # Keep uv on the job's interpreter instead of the .python-version pin.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # One job per OS, no version-by-OS cross product: Linux keeps the 3.12
        # floor; macOS and Windows run the 3.14 validation interpreter
        # (treesitter-chunker#502).
        include:
          - python-version: '3.12'
            platform: ubuntu-latest
            platform-family: linux
          - python-version: '3.14'
            platform: windows-2025
            platform-family: windows
          - python-version: '3.14'
            platform: macos-latest
            platform-family: macos

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    # TEMPORARY Phase A diagnostic (treesitter-chunker#621): find the image's
    # MinGW-w64 gcc. Removed before the PR leaves draft.
    - name: "Diagnostic: where.exe gcc"
      if: matrix.platform-family == 'windows'
      continue-on-error: true
      shell: pwsh
      run: where.exe gcc

    - name: "Diagnostic: list gcc.exe on the Windows image"
      if: matrix.platform-family == 'windows'
      continue-on-error: true
      shell: pwsh
      run: |
        $global:LASTEXITCODE = 0
        Write-Host '--- Get-Command gcc.exe -All'
        Get-Command gcc.exe -All -ErrorAction SilentlyContinue | Format-Table -AutoSize CommandType, Version, Source | Out-String -Width 400 | Write-Host
        Write-Host '--- PATH'
        $env:PATH -split ';' | ForEach-Object { Write-Host $_ }
        $roots = @('C:\mingw64', 'C:\ProgramData\mingw64', 'C:\msys64', 'C:\Strawberry', 'C:\tools')
        if ($env:ChocolateyInstall) { $roots += (Join-Path $env:ChocolateyInstall 'lib\mingw') }
        foreach ($root in $roots) {
          Write-Host "--- scan $root (exists: $(Test-Path $root))"
          if (-not (Test-Path $root)) { continue }
          Get-ChildItem -Path $root -Recurse -Depth 5 -Filter gcc.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $exe = $_.FullName
            $machine = (& $exe -dumpmachine 2>&1 | Out-String).Trim()
            $version = ((& $exe --version 2>&1 | Out-String) -split "`n")[0].Trim()
            Write-Host "gcc.exe: $exe"
            Write-Host "  -dumpmachine: $machine"
            Write-Host "  --version: $version"
          }
        }
        Write-Host '--- scan complete'
        $global:LASTEXITCODE = 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install uv==0.12.11
        uv sync --locked --all-extras

    - name: Fetch grammars
      run: uv run --locked --all-extras python scripts/fetch_grammars.py

    - name: Build grammars
      run: uv run --locked --all-extras python scripts/build_lib.py

    - name: Run platform core tests
      run: |
        uv run --locked --all-extras python scripts/run_platform_core.py --platform ${{ matrix.platform-family }}


    - name: Upload coverage
      if: matrix.platform-family == 'linux'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
