name: Test Suite

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    env:
      # Keep uv on the job's interpreter instead of the .python-version pin.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # One job per OS, no version-by-OS cross product: Linux keeps the 3.12
        # floor; macOS and Windows run the 3.14 validation interpreter
        # (treesitter-chunker#502).
        include:
          - python-version: '3.12'
            platform: ubuntu-latest
            platform-family: linux
            pack-cache-path: ~/.cache/tree-sitter-language-pack
          - python-version: '3.14'
            platform: windows-2025
            platform-family: windows
            pack-cache-path: '%LOCALAPPDATA%\tree-sitter-language-pack'
          - python-version: '3.14'
            platform: macos-latest
            platform-family: macos
            pack-cache-path: ~/Library/Caches/tree-sitter-language-pack

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install uv==0.12.11
        uv sync --locked --all-extras

    # Parsers are verified when downloaded; restored libraries are not re-checked.
    # Warm caches survive an outage; a cold cache during an outage still fails.
    - name: Check language pack cache path
      id: pack-path
      shell: bash
      env:
        PACK_${{ matrix.pack-cache-path }}: ${{ matrix.pack-cache-path }}
      run: |
        uv run --locked --all-extras python - <<'PYTHON'
        import os
        from pathlib import Path
        from tree_sitter_language_pack import cache_dir
        root = Path(os.path.expandvars(os.path.expanduser(os.environ["PACK_${{ matrix.pack-cache-path }}"]))).resolve()
        actual = Path(cache_dir()).resolve()
        print(f"language-pack cache_dir(): {actual}")
        if not actual.is_relative_to(root):
            raise SystemExit(f"language-pack cache {actual} is outside cached path {root}")
        print(f"language-pack path check passed: {root}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"cache-root={root}\n")
        PYTHON

    - name: Restore language pack
      id: pack-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.pack-path.outputs.cache-root }}
        key: language-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
        restore-keys: language-pack-${{ runner.os }}-${{ runner.arch }}-

    - name: Prefetch language pack
      shell: bash
      run: |
        uv run --locked --all-extras python - <<'PYTHON'
        import time
        from typing import get_args
        from tree_sitter_language_pack import DownloadError, SupportedLanguage, prefetch
        for attempt, delay in enumerate((10, 30, 60), start=1):
            print(f"language-pack prefetch attempt {attempt}/3", flush=True)
            try:
                prefetch(list(get_args(SupportedLanguage)))
            except DownloadError as error:
                print(f"language-pack download failed: {error}; backoff {delay}s", flush=True)
                time.sleep(delay)
            else:
                print("language-pack prefetch succeeded", flush=True)
                break
        else:
            raise SystemExit("upstream language-pack release unavailable and cache cold")
        PYTHON

    - name: Save language pack
      if: steps.pack-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.pack-path.outputs.cache-root }}
        key: ${{ steps.pack-cache.outputs.cache-primary-key }}

    - name: Verify exact language pack hit offline
      if: steps.pack-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        HTTPS_PROXY: http://127.0.0.1:9
        HTTP_PROXY: http://127.0.0.1:9
        ALL_PROXY: http://127.0.0.1:9
        NO_PROXY: ''
      run: |
        uv run --locked --all-extras python - <<'PYTHON'
        from typing import get_args
        from tree_sitter_language_pack import SupportedLanguage, prefetch
        prefetch(list(get_args(SupportedLanguage)))
        print("exact language-pack cache hit: offline whole-pack prefetch passed")
        PYTHON

    - name: Fetch grammars
      run: uv run --locked --all-extras python scripts/fetch_grammars.py

    - name: Build grammars
      run: uv run --locked --all-extras python scripts/build_lib.py

    # The installer runs the gcc first on PATH (treesitter-chunker#621). On
    # Windows that must be MinGW-w64: the image's own, found by the Phase A
    # diagnostic (run 42547736508: C:\mingw64\bin\gcc.exe, target
    # x86_64-w64-mingw32, gcc 15.2.0), or MSYS2 UCRT64 gcc if it is gone.
    # Add-Content, and the Target line of gcc -v (the same configured target
    # machine as its dumpmachine option), keep these lines clear of the
    # release-hygiene short-option scan.
    - name: Locate the image's MinGW-w64 gcc
      id: mingw
      if: matrix.platform-family == 'windows'
      shell: pwsh
      env:
        MINGW_BIN: 'C:\mingw64\bin'
      run: |
        if (Test-Path (Join-Path $env:MINGW_BIN 'gcc.exe')) {
          Add-Content -Path $env:GITHUB_PATH -Value $env:MINGW_BIN -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'found=true' -Encoding utf8
        } else {
          Write-Host "::warning::no gcc.exe in $env:MINGW_BIN; installing MSYS2 UCRT64 gcc"
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'found=false' -Encoding utf8
        }

    - name: Install MSYS2 UCRT64 gcc (only if the image has no MinGW)
      id: msys2
      if: matrix.platform-family == 'windows' && steps.mingw.outputs.found != 'true'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0 (2026-09-27)
      with:
        msystem: UCRT64
        install: mingw-w64-ucrt-x86_64-gcc
        path-type: inherit
        update: false

    - name: Put MSYS2 UCRT64 gcc on PATH (fallback)
      if: matrix.platform-family == 'windows' && steps.mingw.outputs.found != 'true'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin') -Encoding utf8

    - name: Check the installer's gcc is MinGW-w64
      if: matrix.platform-family == 'windows'
      shell: pwsh
      run: |
        where.exe gcc
        gcc --version
        $target = (gcc -v 2>&1 | Select-String -Pattern '^Target:\s*(\S+)').Matches
        $machine = if ($target) { $target[0].Groups[1].Value } else { '' }
        Write-Host "gcc target machine: $machine"
        if ($machine -notmatch 'w64-mingw32') { throw "gcc on PATH is not MinGW-w64: $machine" }

    - name: Check controlled installer recipe
      env:
        CHUNKER_REQUIRE_INSTALLER_COMPILER: '1'
      run: uv run --locked --all-extras python -m pytest -q -s tests/test_reproducible_grammar_build.py tests/test_release_hygiene_policy.py

    - name: Run platform core tests
      run: |
        uv run --locked --all-extras python scripts/run_platform_core.py --platform ${{ matrix.platform-family }}


    - name: Upload coverage
      if: matrix.platform-family == 'linux'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
