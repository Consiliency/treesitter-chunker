name: Release

concurrency:
  group: release-${{ github.ref || github.event.inputs.version }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PRERELEASE=false
        else
          TAG_NAME=v${{ github.event.inputs.version }}
          PRERELEASE=${{ github.event.inputs.prerelease }}
        fi

        PACKAGE_VERSION=$(python - <<'PY'
        from pathlib import Path
        import re

        text = Path("pyproject.toml").read_text(encoding="utf-8")
        match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
        if not match:
            raise SystemExit("Unable to determine package version from pyproject.toml")
        print(match.group(1))
        PY
        )

        if [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
          echo "Tag $TAG_NAME does not match pyproject version $PACKAGE_VERSION"
          exit 1
        fi

        echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
        echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
        echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

    - name: Check PyPI for existing version
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease != 'true')
      run: |
        python - <<'PY'
        import json
        import sys
        import urllib.error
        import urllib.request

        package = "treesitter-chunker"
        version = "${{ steps.version.outputs.package_version }}"
        url = f"https://pypi.org/pypi/{package}/json"

        try:
            with urllib.request.urlopen(url) as response:
                data = json.load(response)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                sys.exit(0)
            raise

        if version in data.get("releases", {}):
            raise SystemExit(f"Version {version} already exists on PyPI")
        PY

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system build wheel twine
        uv pip install --system git+https://github.com/tree-sitter/py-tree-sitter.git
        uv pip install --system -e .

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distribution-artifacts
        path: dist/*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-distributions

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" | head -20)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
        fi
        
        cat > RELEASE_NOTES.md << EOF
        ## What's Changed
        
        $CHANGELOG
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ needs.build-distributions.outputs.tag_name }}
        EOF
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: distribution-artifacts
        path: ./dist

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.build-distributions.outputs.tag_name }}
        name: Release ${{ needs.build-distributions.outputs.tag_name }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: ${{ needs.build-distributions.outputs.prerelease == 'true' }}
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist/checksums.txt

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-distributions
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease != 'true')

    environment:
      name: pypi
      url: https://pypi.org/p/treesitter-chunker

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: distribution-artifacts
        path: dist

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: |
          dist/*.whl
          dist/*.tar.gz
