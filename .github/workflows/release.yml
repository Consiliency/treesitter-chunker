name: Release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref || github.event.inputs.version }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0

    - name: Determine version
      id: version
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
        INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PRERELEASE=false
        else
          TAG_NAME="v$INPUT_VERSION"
          PRERELEASE="$INPUT_PRERELEASE"
        fi

        PACKAGE_VERSION=$(python - <<'PY'
        from pathlib import Path
        import re

        text = Path("pyproject.toml").read_text(encoding="utf-8")
        match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
        if not match:
            raise SystemExit("Unable to determine package version from pyproject.toml")
        print(match.group(1))
        PY
        )

        if [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
          echo "Tag $TAG_NAME does not match pyproject version $PACKAGE_VERSION"
          exit 1
        fi

        {
          echo "tag_name=$TAG_NAME"
          echo "package_version=$PACKAGE_VERSION"
          echo "prerelease=$PRERELEASE"
        } >> "$GITHUB_OUTPUT"

    - name: Check PyPI for existing version
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease != 'true')
      run: |
        python - <<'PY'
        import json
        import sys
        import urllib.error
        import urllib.request

        package = "treesitter-chunker"
        version = "${{ steps.version.outputs.package_version }}"
        url = f"https://pypi.org/pypi/{package}/json"

        try:
            with urllib.request.urlopen(url) as response:
                data = json.load(response)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                sys.exit(0)
            raise

        if version in data.get("releases", {}):
            raise SystemExit(f"Version {version} already exists on PyPI")
        PY

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system build wheel twine
        uv pip install --system git+https://github.com/tree-sitter/py-tree-sitter.git
        uv pip install --system -e .

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Generate checksums
      run: |
        cd dist
        sha256sum -- * > checksums.txt

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: distribution-artifacts
        path: |
          dist/*.whl
          dist/*.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-distributions

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" | head -20)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
        fi
        
        cat > RELEASE_NOTES.md << EOF
        ## What's Changed
        
        $CHANGELOG
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ needs.build-distributions.outputs.tag_name }}
        EOF
        
        {
          echo "changelog<<EOF"
          cat RELEASE_NOTES.md
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      with:
        name: distribution-artifacts
        path: ./dist

    - name: Create release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
      with:
        tag_name: ${{ needs.build-distributions.outputs.tag_name }}
        name: Release ${{ needs.build-distributions.outputs.tag_name }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: ${{ needs.build-distributions.outputs.prerelease == 'true' }}
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist/checksums.txt

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-distributions
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease != 'true')

    environment:
      name: pypi
      url: https://pypi.org/p/treesitter-chunker

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distribution-artifacts
        path: dist

    - name: Remove non-package artifacts
      run: rm -f dist/checksums.txt

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

  update-changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    needs: build-distributions
    if: github.event_name == 'push'

    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0
        ref: main

    - name: Update CHANGELOG.md
      uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
      with:
        config: cliff.toml
        args: --tag ${{ needs.build-distributions.outputs.tag_name }}
      env:
        OUTPUT: CHANGELOG.md
        GITHUB_REPO: ${{ github.repository }}

    - name: Open changelog PR
      # main is a protected branch (required status checks), so a bot cannot push
      # to it directly — the old `git push origin main` failed every release with
      # GH006. Route the regenerated changelog through a PR instead; nothing about
      # the release (build / PyPI publish / GitHub Release) depends on this step.
      env:
        TAG: ${{ needs.build-distributions.outputs.tag_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- CHANGELOG.md; then
          echo "CHANGELOG.md unchanged for ${TAG}; nothing to open."
          exit 0
        fi
        branch="chore/changelog-${TAG}"
        git checkout -b "$branch"
        git add CHANGELOG.md
        git commit -m "docs(changelog): update for ${TAG}"
        git push origin "$branch"
        gh pr create --base main --head "$branch" \
          --title "docs(changelog): update for ${TAG}" \
          --body "Automated changelog regeneration for ${TAG} (git-cliff). Merge to keep CHANGELOG.md current; the release itself is already published." \
          || echo "PR may already exist for ${branch}"
