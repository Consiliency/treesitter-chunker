name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # 3.14 is the main version for every CI run, including the scheduled full
      # tier (maintainer decision, treesitter-chunker#502). The 3.12 minimum
      # keeps only Linux platform-core (test.yml) and the release installed-wheel
      # check until it is dropped in 7.0 (treesitter-chunker#599).
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Install Graphviz executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          dot -V

      - name: Cache grammars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            grammars/
            build/
          key: grammars-${{ runner.os }}-${{ hashFiles('scripts/fetch_grammars.py') }}
          restore-keys: |
            grammars-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install uv==0.12.11

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras
          uv run --locked --all-extras python - <<'PY'
          import importlib.metadata as m
          expected = {"tree-sitter": "0.26.0", "tree-sitter-language-pack": "1.20.0"}
          installed = {name: m.version(name) for name in expected}
          assert installed == expected, f"parser stack drifted: {installed} != {expected}"
          print(f"parser stack pinned at {installed}")
          PY

      # Parsers are verified when downloaded; restored libraries are not re-checked.
      # Warm caches survive an outage; a cold cache during an outage still fails.
      - name: Check language pack cache path
        id: pack-path
        shell: bash
        env:
          PACK_~/.cache/tree-sitter-language-pack: ~/.cache/tree-sitter-language-pack
        run: |
          uv run --locked --all-extras python - <<'PYTHON'
          import os
          from pathlib import Path
          from tree_sitter_language_pack import cache_dir
          root = Path(os.path.expandvars(os.path.expanduser(os.environ["PACK_~/.cache/tree-sitter-language-pack"]))).resolve()
          actual = Path(cache_dir()).resolve()
          print(f"language-pack cache_dir(): {actual}")
          if not actual.is_relative_to(root):
              raise SystemExit(f"language-pack cache {actual} is outside cached path {root}")
          print(f"language-pack path check passed: {root}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cache-root={root}\n")
          PYTHON

      - name: Restore language pack
        id: pack-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.pack-path.outputs.cache-root }}
          key: language-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: language-pack-${{ runner.os }}-${{ runner.arch }}-

      - name: Prefetch language pack
        shell: bash
        run: |
          uv run --locked --all-extras python - <<'PYTHON'
          import time
          from typing import get_args
          from tree_sitter_language_pack import DownloadError, SupportedLanguage, prefetch
          for attempt, delay in enumerate((10, 30, 60), start=1):
              print(f"language-pack prefetch attempt {attempt}/3", flush=True)
              try:
                  prefetch(list(get_args(SupportedLanguage)))
              except DownloadError as error:
                  print(f"language-pack download failed: {error}; backoff {delay}s", flush=True)
                  time.sleep(delay)
              else:
                  print("language-pack prefetch succeeded", flush=True)
                  break
          else:
              raise SystemExit("upstream language-pack release unavailable and cache cold")
          PYTHON

      - name: Save language pack
        if: steps.pack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.pack-path.outputs.cache-root }}
          key: ${{ steps.pack-cache.outputs.cache-primary-key }}

      - name: Verify exact language pack hit offline
        if: steps.pack-cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          uv run --locked --all-extras python - <<'PYTHON'
          from typing import get_args
          from tree_sitter_language_pack import SupportedLanguage, prefetch
          prefetch(list(get_args(SupportedLanguage)))
          print("exact language-pack cache hit: offline whole-pack prefetch passed")
          PYTHON

      - name: Fetch grammars
        run: uv run --locked --all-extras python scripts/fetch_grammars.py
        continue-on-error: true  # Don't fail CI if grammar fetch fails

      - name: Build grammars
        run: uv run --locked --all-extras python scripts/build_lib.py
        continue-on-error: true  # Grammar build is optional for linting

      - name: Ruff
        run: |
          # Run ruff on production code and tests only (exclude archive, logs, etc.)
          # Use the uv-locked ruff (0.12.5) so CI matches the lockfile + local;
          # avoids unpinned-ruff drift flagging pre-existing issues on every push.
          # chunker/build/ is listed explicitly: recursive discovery skips it via
          # the .gitignore and [tool.ruff] "build" exclusions meant for generated
          # output. The path list must match release.yml and CONTRIBUTING.md
          # (tests/test_lint_path_policy.py, treesitter-chunker#517).
          uv run --locked --all-extras ruff check chunker/ chunker/build/ cli/ tests/ tools/governed_group.py tools/governed_scope.py tools/sync_governed_test_transport.py --exclude archive --exclude logs --exclude site

      - name: Black
        run: uv run --locked --all-extras black --check chunker/ cli/ tests/ scripts/ tools/governed_group.py tools/governed_scope.py tools/sync_governed_test_transport.py

      # Note: isort check removed - ruff handles import sorting (I001)


      - name: Mypy
        shell: bash
        run: |
          uv run --locked --all-extras python scripts/mypy_gate.py

      - name: Governed tools type check
        shell: bash
        run: |
          uv run --locked --all-extras mypy --follow-imports=silent --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls --check-untyped-defs --no-pretty --no-error-summary --show-error-codes tools/sync_governed_test_transport.py

      - name: Pytest
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            uv run --locked --all-extras python scripts/run_full_suite.py
          else
            uv run --locked --all-extras python scripts/run_ci_smoke.py
          fi
        timeout-minutes: 60
