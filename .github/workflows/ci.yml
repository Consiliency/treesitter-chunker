name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Cache grammars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            grammars/
            build/
          key: grammars-${{ runner.os }}-${{ hashFiles('scripts/fetch_grammars.py') }}
          restore-keys: |
            grammars-${{ runner.os }}-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          # toml, httpx, and jsonschema are declared in the [dev] extra, so the
          # single editable install below covers them -- no ad-hoc pip installs.
          #
          # Pin the parser stack to the versions used by the committed coverage
          # oracle. `uv pip install` does not consult uv.lock, so both versions
          # are repeated here to prevent CI from floating independently.
          # Pack 1.17 downloads its parser bundle on first use; the prefetch step
          # below moves that network boundary ahead of the parallel smoke tests.
          uv pip install --system -e ".[dev,api,viz,templates,advanced]" \
            "tree-sitter==0.26.0" \
            "tree-sitter-language-pack==1.17.0"
          # Fail loudly (not silently green) if the install resolved a different
          # pack than the gate's oracle was baked against.
          python - <<'PY'
          import importlib.metadata as m
          expected = {"tree-sitter": "0.26.0", "tree-sitter-language-pack": "1.17.0"}
          installed = {name: m.version(name) for name in expected}
          assert installed == expected, f"parser stack drifted: {installed} != {expected}"
          print(f"parser stack pinned at {installed}")
          PY

      - name: Prefetch language pack
        run: |
          python - <<'PY'
          from typing import get_args
          from tree_sitter_language_pack import SupportedLanguage, prefetch
          prefetch(list(get_args(SupportedLanguage)))
          PY

      - name: Fetch grammars
        run: python scripts/fetch_grammars.py
        continue-on-error: true  # Don't fail CI if grammar fetch fails

      - name: Build grammars
        run: python scripts/build_lib.py
        continue-on-error: true  # Grammar build is optional for linting

      - name: Ruff
        run: |
          # Run ruff on production code and tests only (exclude archive, logs, etc.)
          # Use the uv-locked ruff (0.12.5) so CI matches the lockfile + local;
          # avoids unpinned-ruff drift flagging pre-existing issues on every push.
          uv run --all-extras ruff check chunker/ cli/ tests/ --exclude archive --exclude logs --exclude site

      - name: Black
        run: uv run --all-extras black --check chunker/ cli/ tests/ scripts/

      # Note: isort check removed - ruff handles import sorting (I001)


      - name: Mypy
        shell: bash
        run: |
          uv run --all-extras python scripts/mypy_gate.py

      - name: Pytest
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            uv run --with toml --all-extras python scripts/run_full_suite.py
          else
            uv run --with toml --all-extras python scripts/run_ci_smoke.py
          fi
        timeout-minutes: 60
