name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache grammars
        uses: actions/cache@v5
        with:
          path: |
            grammars/
            build/
          key: grammars-${{ runner.os }}-${{ hashFiles('scripts/fetch_grammars.py') }}
          restore-keys: |
            grammars-${{ runner.os }}-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,api,viz,templates,advanced]"
          uv pip install --system toml httpx  # Required by tests

      - name: Fetch grammars
        run: python scripts/fetch_grammars.py
        continue-on-error: true  # Don't fail CI if grammar fetch fails

      - name: Build grammars
        run: python scripts/build_lib.py
        continue-on-error: true  # Grammar build is optional for linting

      - name: Ruff
        run: |
          # Run ruff on production code and tests only (exclude archive, logs, etc.)
          # Use the uv-locked ruff (0.12.5) so CI matches the lockfile + local;
          # avoids unpinned-ruff drift flagging pre-existing issues on every push.
          uv run --all-extras ruff check chunker/ cli/ tests/ --exclude archive --exclude logs --exclude site

      - name: Black
        run: uv run --all-extras black --check chunker/ cli/ tests/ scripts/

      # Note: isort check removed - ruff handles import sorting (I001)


      - name: Mypy
        shell: bash
        run: |
          # Run mypy on production code only, excluding tests and scripts
          if ! mypy chunker/ cli/ --ignore-missing-imports; then
            echo "::warning::mypy reported known non-blocking type issues"
          fi

      - name: Pytest
        run: |
          # Run a small smoke suite in CI and keep broad coverage in the
          # local-first workflow plus the separate Test Suite matrix.
          python scripts/run_ci_smoke.py
        timeout-minutes: 60
