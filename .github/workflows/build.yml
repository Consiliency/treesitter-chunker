name: Build Distributions

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, blacksmith-4vcpu-windows-2025, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools

    - name: Determine version
      id: version
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="$INPUT_VERSION"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build wheel
      run: |
        python -m build --wheel --outdir dist/

    - name: Upload wheel artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist
      run: python -m build --sdist --outdir dist/

    - name: Upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sdist
        path: dist/*.tar.gz

  build-manylinux:
    name: Build manylinux wheels
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    
    strategy:
      matrix:
        python: ['cp311-cp311', 'cp312-cp312']
    
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Build wheels
      run: |
        /opt/python/${{ matrix.python }}/bin/python -m pip install build wheel
        /opt/python/${{ matrix.python }}/bin/python -m build --wheel --outdir dist/

    - name: Audit wheels
      run: |
        for wheel in dist/*.whl; do
          if [[ "$wheel" == *"none-any"* ]]; then
            echo "Skipping pure-Python wheel (no native code): $wheel"
          else
            auditwheel repair "$wheel" -w dist/
            rm "$wheel"
          fi
        done

    - name: Upload manylinux wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: manylinux-wheels-${{ matrix.python }}
        path: dist/*.whl

  collect-artifacts:
    name: Collect all artifacts
    needs: [build-wheels, build-sdist, build-manylinux]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist/

    - name: List all artifacts
      run: |
        find dist -type f -name "*.whl" -o -name "*.tar.gz" | sort

    - name: Create checksums
      run: |
        cd dist
        sha256sum -- **/*.whl **/*.tar.gz > checksums.txt
        cat checksums.txt

    - name: Upload final artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: distribution-artifacts
        path: |
          dist/**/*.whl
          dist/**/*.tar.gz
          dist/checksums.txt
